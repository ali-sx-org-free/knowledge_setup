# 持續集成：每個 PR 與 main 上的推送都會跑。
#   test             單元 + 端到端測試（Node 22 / 24；含經本機 sshd 的 SSH 部署金鑰端到端）
#   docker           構建容器映像並確認服務能啟動
#   package          打包發佈包（與 Release 流水綫同一個腳本），並做腳本靜態檢查
#   install-*        在 Linux / macOS / Windows 上用模擬鏡像跑一鍵安裝冒煙測試，並真實下載 Node.js（Windows 另含 MinGit）
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 測試 · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # npm test 用 node --test 的 glob 參數，需要 Node 21+；Node 20 已於 2026-04 停止維護
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安裝 OpenSSH（SSH 部署金鑰端到端測試需要 sshd）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-client openssh-server
          sudo mkdir -p /run/sshd
      - run: npm ci
      - run: npm test

  docker:
    name: 容器映像
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t knowledge:ci .
      - name: 容器內服務能啟動並登入
        run: |
          docker run -d --name kb -p 8080:8080 -e ADMIN_PASSWORD=ci-admin-pass knowledge:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/prompt && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/api/v1/prompt || { docker logs kb; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"password":"ci-admin-pass"}' http://127.0.0.1:8080/admin/api/login)
          [ "$code" = 200 ] || { echo "登入返回 $code"; docker logs kb; exit 1; }
      - if: always()
        run: docker rm -f kb || true

  package:
    name: 打包發佈包
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 腳本靜態檢查
        run: |
          shellcheck --severity=warning release/install.sh release/bin/knowledge release/build.sh release/test/smoke.sh
          pwsh -NoProfile -Command '
            $bad = 0
            foreach ($f in "release/install.ps1", "release/bin/knowledge.ps1", "release/test/smoke.ps1") {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errors)
              foreach ($e in $errors) { Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
              $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f).Path)
              if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { Write-Host "::error file=$f::需要 UTF-8 BOM，否則 Windows PowerShell 5.1 會把中文讀成亂碼"; $bad++ }
            }
            exit $bad'
      - run: bash release/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  install-unix:
    name: 一鍵安裝 · ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: 冒煙測試（模擬鏡像 + 真實下載 Node.js）
        env:
          SMOKE_REAL_NODE: '1'
        # macOS 用系統自帶的 bash 3.2，確認腳本不依賴 bash 4+ 語法
        run: /bin/bash release/test/smoke.sh dist

  install-windows:
    name: 一鍵安裝 · windows-latest
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: 冒煙測試（Windows PowerShell 5.1；模擬鏡像 + 真實下載 Node.js 與 MinGit）
        shell: powershell
        env:
          SMOKE_REAL_NODE: '1'
          SMOKE_REAL_GIT: '1'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File release\test\smoke.ps1 -Dist dist
